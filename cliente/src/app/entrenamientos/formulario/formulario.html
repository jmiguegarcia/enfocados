<h2>Añadir entrenamiento</h2>

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <label>
    Fecha
    <input type="date" formControlName="fecha" />
  </label>

  <label>
    Tipo
    <input type="text" formControlName="tipo" placeholder="Fuerza, Cardio, etc." />
  </label>

  <label>
    Duración en minutos
    <input type="number" formControlName="duracionMinutos" />
  </label>

  <label>
    Notas
    <textarea formControlName="notas" placeholder="Detalles de la sesión..."></textarea>
  </label>

  <div class="checkbox-campo">
    <label class="checkbox-label">
      <input type="checkbox" formControlName="oculto" />
      <span>🔒 Ocultar a los alumnos (liberar más adelante)</span>
    </label>
  </div>

  <button type="submit" class="btn-guardar">Guardar</button>
</form>
