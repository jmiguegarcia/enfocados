<h2>
  @if (authService.puedeCrearEditar()) {
    Editar entrenamiento
  } @else {
    Añadir notas / observaciones
  }
</h2>

@if (!authService.puedeCrearEditar()) {
  <p class="aviso-asistente">
    ℹ️ Puedes añadir y modificar las notas u observaciones de la sesión.
  </p>
}

<form [formGroup]="formulario" (ngSubmit)="guardar()">
  <label>
    Fecha
    <input type="date" formControlName="fecha" />
  </label>

  <label>
    Tipo
    <input type="text" formControlName="tipo" />
  </label>

  <label>
    Duración en minutos
    <input type="number" formControlName="duracionMinutos" />
  </label>

  <label>
    Notas / Observaciones
    <textarea formControlName="notas" rows="4"></textarea>
  </label>

  @if (authService.puedeCrearEditar()) {
    <div class="checkbox-campo">
      <label class="checkbox-label">
        <input type="checkbox" formControlName="oculto" />
        <span>🔒 Ocultar a los alumnos (liberar más adelante)</span>
      </label>
    </div>
  }

  <button type="submit" class="btn-guardar">
    @if (authService.puedeCrearEditar()) {
      Guardar cambios
    } @else {
      Guardar notas
    }
  </button>
</form>
