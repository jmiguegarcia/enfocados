<h2>Entrenamientos</h2>

<div class="cards">
  @for (entrenamiento of entrenamientos(); track entrenamiento.id) {
    <article class="card">
      <h3>{{ entrenamiento.tipo }} - {{ entrenamiento.fecha }}</h3>
      <p class="duracion">{{ entrenamiento.duracionMinutos }} min</p>
      <p class="notas">{{ entrenamiento.notas }}</p>
      <div class="acciones">
        <a [routerLink]="['/editar', entrenamiento.id]" class="btn editar">Editar</a>
        <button type="button" (click)="eliminarEntrenamiento(entrenamiento.id)" class="btn eliminar">
          Eliminar
        </button>
      </div>
    </article>
  }
</div>
