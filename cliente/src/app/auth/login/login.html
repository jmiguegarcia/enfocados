<div class="auth-container">
  <div class="auth-card">
    <div class="auth-header">
      <h2>Iniciar Sesión</h2>
      <p>Ingresa a Training Tracker con tu cuenta</p>
    </div>

    @if (mensajeError()) {
      <div class="alerta-error">
        ⚠️ {{ mensajeError() }}
      </div>
    }

    <form [formGroup]="formulario" (ngSubmit)="iniciarSesion()">
      <div class="campo">
        <label for="email">Correo Electrónico</label>
        <input
          id="email"
          type="email"
          formControlName="email"
          placeholder="ejemplo@tracker.com"
          autocomplete="username"
        />
      </div>

      <div class="campo">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          placeholder="••••••••"
          autocomplete="current-password"
        />
      </div>

      <button type="submit" [disabled]="formulario.invalid || cargando()" class="btn-primary">
        @if (cargando()) {
          Entrando...
        } @else {
          Ingresar
        }
      </button>
    </form>

    <div class="cuentas-prueba">
      <p class="titulo-prueba">💡 Cuentas de prueba rápidas (Contraseña: <code>123456</code>):</p>
      <div class="botones-prueba">
        <button type="button" (click)="cargarCredencialesPrueba('admin@tracker.com')">
          👑 Superadmin
        </button>
        <button type="button" (click)="cargarCredencialesPrueba('coach@tracker.com')">
          🏋️ Head Coach
        </button>
        <button type="button" (click)="cargarCredencialesPrueba('asistente@tracker.com')">
          ⏱️ Asistente
        </button>
        <button type="button" (click)="cargarCredencialesPrueba('juan@tracker.com')">
          🎓 Alumno (Juan)
        </button>
        <button type="button" (click)="cargarCredencialesPrueba('inactivo@tracker.com')" class="btn-inactivo-test">
          🚫 Inactivo
        </button>
      </div>
    </div>

    <div class="auth-footer">
      <span>¿No tienes una cuenta? </span>
      <a routerLink="/registro">Regístrate como alumno</a>
    </div>
  </div>
</div>
